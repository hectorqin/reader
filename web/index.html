<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <!--
      maximum-scale=1 disables pinch-zoom. That is deliberate: text size belongs
      to the reader's own control, and a visual zoom fights CSS pagination, which
      is measured in viewport units. Android WebView honours this; iOS Safari
      ignores it, which is acceptable since iOS is out of scope for v1.

      No external font: a self-hosted reader must work with no outbound network
      at all, and a webfont would also fail on the LAN with no internet uplink.
      The book's own embedded fonts are unaffected — they load from the archive.

      The icon font is not an exception to this. It is a 16KB file in the bundle,
      loaded by a relative URL from the same directory as this document, so it is
      covered by the same rule: nothing here reaches the network.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/reader.svg" />
    <link rel="alternate icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="reader" />
    <title>reader</title>
    <style>
      /* First paint only: prevents a white flash before the bundle applies the
         stored theme, and gives the reader something to look at on a slow LAN. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fbfaf7;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #16171a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
