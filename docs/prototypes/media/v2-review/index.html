const state={page:'video',theme:'forest',channel:'video',playing:false,mini:false,timer:0,sheet:null,pop:null,scope:'全部',query:'山',favorite:false,selection:0,member:false,queue:songs.slice(),current:0,lyric:2};let trigger=null,toastTimer;
const link=(id,body,cls='')=>`<a class="${cls}" href="#${byId[id][3]}" data-go="${id}">${body}</a>`;

const ib=(icon,action,label)=>`<button type="button" class="icon-button" data-action="${action}" aria-label="${label}" title="${label}">${ic(icon)}</button>`;
function cover(title,i=0,shape=''){return `<div class="cover ${shape}" style="--cover:${colors[i%colors.length]}" role="img" aria-label="${esc(title)}示例封面"><span class="art-mark">READER / PRIVATE COLLECTION</span><span class="art-title">${esc(title)}</span><span class="art-mark">${shape==='square'?'SOUND ARCHIVE':'私人收藏'}</span></div>`;}
function grid(items,target,shape=''){return `<div class="grid">${items.map(([t,m,i])=>link(target,cover(t,i,shape)+`<span class="tile-title">${esc(t)}</span><span class="tile-meta">${esc(m)}</span>`,'tile')).join('')}</div>`;}
function section(title,extra=''){return `<div class="section-head"><h2>${title}</h2>${extra}</div>`;}
function tabs(items,active){return `<nav class="tabs" aria-label="频道分类">${items.map(([id,label])=>link(id,label,id===active?'active':'')).join('')}</nav>`;}
function topbar(){let p=byId[state.page],home=['video','movies','series','music','artists','tracks','audiobooks','narrators','empty','loading','unavailable'].includes(state.page);let channelLabel={video:'影视',music:'音乐',audiobook:'有声书'}[state.channel];return `<header class="topbar ${home?'':'secondary-bar'}"><span class="brand">reader.</span>${home?`${button(channelLabel+ic('switch'),'popover:channel','channel-title') }<nav class="desktop-channels" aria-label="频道">${link('video','影视',state.channel==='video'?'active':'')}${link('music','音乐',state.channel==='music'?'active':'')}${link('audiobooks','有声书',state.channel==='audiobook'?'active':'')}${button('阅读','reading')}</nav><span class="spacer"></span>${ib('search','go:search','搜索影音')}${ib('more','popover:global','更多影音操作')}`:`${ib('back','back','返回')}<strong class="page-title">${p[2]}</strong>${['movie','show','album','artist','book','narrator'].includes(state.page)?ib('more','popover:detail','本页操作'):['music-player','lyrics','audio-player','video-player','episode-player'].includes(state.page)?ib('more','sheet:player-more','播放选项'):state.page==='queue'?ib('more','sheet:queue-options','队列操作'):''}`}</header>`;}
function tools(count){return `<div class="browse-tools">${button('全部媒体库'+ic('down'),'sheet:library-filter','scope-button')}<span class="count">${count}</span><span class="spacer"></span>${ib('folder','go:folders','文件夹浏览')}${ib('settings','sheet:sort','排序与筛选')}</div>`;}
function resume(title,type){return `<div class="resume">${cover(title,0,'square')}<div class="spacer"><strong>${title}</strong><small>${type==='video'?'已看 38 分钟 · 剩余 1 小时 10 分':type==='book'?'第 6 章 · 上次听到 12:48':'北岸 · 上次听到 01:36'}</small></div>${ib('play','start:'+type,'继续'+(type==='video'?'观看':'收听'))}</div>`;}
function catalog(){let p=state.page;if(['video','movies','series'].includes(p))return tabs([['video','首页'],['movies','电影'],['series','剧集']],p)+(p==='video'?resume('海岸线','video'):'')+tools(p==='series'?'6 部剧集':'42 部电影')+grid(p==='series'?[['远山之路','2 季 · 12 集',4],['山海之间','1 季 · 8 集',1],['光的来处','1 季 · 10 集',2],['深林之中','2 季 · 16 集',0],['寻常人家','1 季 · 24 集',3],['蓝色星球','1 季 · 6 集',5]]:movies,p==='series'?'show':'movie');
if(['music','artists','tracks'].includes(p)){let h=tabs([['music','专辑'],['artists','歌手'],['tracks','曲目']],p);if(p==='music')return h+(!state.mini?resume('森林来信','music'):'')+tools('36 张专辑')+grid(albums,'album','square');if(p==='tracks')return h+tools('428 首曲目')+trackList(songs);return h+tools('12 位歌手')+`<div class="grid">${['北岸','南风','山川乐队','浅湾','林末','自然录音'].map((n,i)=>link('artist',`<div class="avatar" style="background:${colors[i]}">${n.slice(0,1)}</div><span class="tile-title">${n}</span><span class="tile-meta">${i+2} 张专辑</span>`,'tile')).join('')}</div>`;}
let h=tabs([['audiobooks','作品'],['narrators','演播者']],p);return p==='narrators'?h+tools('8 位演播者')+['周宁','陈青','许舟','南音','周野'].map((n,i)=>`<div class="result-row"><div class="avatar" style="background:${colors[i]}">${n[0]}</div>${link('narrator',`<strong>${n}</strong><small>${i+2} 部作品</small>`,'row-link')}${ic('chevron')}</div>`).join(''):h+(!state.mini?resume('山间来信','book'):'')+tools('18 部有声书')+grid(books,'book');}
function resource(label='原版 · 1080p · 1 个文件'){return `<div class="resource">${section('资源信息',ib('more','popover:resource','资源信息操作'))}<p>${label}</p></div><p class="provenance">资料来源：本地 NFO${state.page==='album'?' / 内嵌标签':''}</p>`;}
function hero(title,meta,shape='',i=0,eyebrow=''){return `<div class="hero">${cover(title,i,shape)}<div class="hero-copy">${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${title}</h1>${meta}</div></div>`;}
function actions(kind,label){return `<div class="hero-actions">${button(ic('play')+label,'start:'+kind,'primary')}${ib('heart','favorite',state.favorite?'取消收藏':'收藏作品')}${kind==='music'?ib('queue','enqueue','加入播放队列'):''}</div>`;}
function trackList(items,chapter=false,offset=0){return items.map((t,index)=>{const i=index+offset;return `<div class="track-row ${i===(chapter?5:state.current)?'current':''}"><span class="number">${i===(chapter?5:state.current)?ic('music'):String(i+1).padStart(2,'0')}</span><button class="row-link" data-action="${chapter?'chapter':'track'}:${i}"><strong>${t}</strong><small>${chapter?(i===5?'上次听到 12:48':'第 '+(i+1)+' 章'):'北岸'}</small></button><time>${chapter?'24:36':['3:42','4:08','3:26','4:52'][i%4]}</time>${ib('more','sheet:track-more','更多'+(chapter?'章节':'曲目')+'操作')}</div>`;}).join('');}
function detail(){let p=state.page;if(p==='album')return `<div class="detail">${hero('静谧时刻',link('artist','北岸'+ic('chevron'),'artist-link')+'<p>2024 · 8 首 · 32 分钟</p>','square',0,'专辑')}${actions('music','播放全部')}<div class="detail-layout"><div>${section('曲目','<small>8 首 · 32 分钟</small>')}${trackList(songs)}</div><aside>${resource('原版 · 8 首曲目 · FLAC')}${section('关于这张专辑')}<p class="synopsis">从清晨的风到夜里的溪流，记录安静日常中的声音。</p></aside></div></div>`;
if(p==='artist'||p==='narrator'){let narrator=p==='narrator';return `<div class="detail"><div class="hero"><div class="avatar">${narrator?'宁':'岸'}</div><div class="hero-copy"><div class="eyebrow">${narrator?'演播者':'音乐人'}</div><h1>${narrator?'周宁':'北岸'}</h1><p>${narrator?'4 部有声书 · 86 章':'3 张专辑 · 28 首曲目'}</p></div>${ib('heart','favorite','收藏'+(narrator?'演播者':'歌手'))}</div>${section('简介')}<p class="synopsis">${narrator?'以温和自然的声音，讲述生活与远行的故事。':'独立音乐人，将自然录音与原声器乐融入日常创作。'}</p>${section(narrator?'演播作品':'专辑','<small>'+ (narrator?'4 部':'3 张')+'</small>')}${grid(narrator?books.slice(0,4):albums.slice(0,3),narrator?'book':'album',narrator?'':'square')}${narrator?'':section('热门曲目')+trackList(songs.slice(0,3))}</div>`;}
let book=p==='book',show=p==='show';return `<div class="detail">${hero(book?'山间来信':show?'远山之路':'海岸线',book?'<p>林间 著 · 周宁 演播</p><p>18 章 · 7 小时 24 分</p>':show?'<p>2024 · 剧情 · 2 季</p><p>12 集 · 已收录 12 集</p>':'<p>2024 · 剧情</p><p>1 小时 48 分 · 中国大陆</p>','',book?4:0,book?'有声书':show?'剧集':'电影')}${actions(book?'book':show?'episode':'video',book?'继续第 6 章':show?'继续第 3 集':'继续观看 · 38:12')}<div class="detail-layout"><div>${section(book?'内容简介':'剧情简介')}<p class="synopsis">${book?'一封封寄往山里的信，记录季节更替、远行与归来。跟随温暖的讲述，在日常细微处发现生活的纹理。':'一位久别故乡的年轻人沿着海岸返回，在旧港口与山间小镇之间，重新寻找记忆中家的方向。'}</p>${show?section('选集',button('第 1 季'+ic('down'),'sheet:seasons','scope-button'))+episodes():book?section('章节',link('chapters','全部 18 章 '+ic('chevron')))+trackList(chapters.slice(4,7),true,4):''}</div><aside>${resource(book?'周宁演播版 · 18 章 · MP3':show?'原版 · 12 集 · 1080p':'原版 · 1080p · 1 个文件')}${book?`<div class="info-line"><strong>演播者</strong>${link('narrator','周宁 '+ic('chevron'),'text-link')}</div>`:''}</aside></div></div>`;}

else if(type==='speed'){title='播放倍速';content=[0.75,1,1.25,1.5,2].map(n=>option(n+'×','toast:已设置 '+n+' 倍速（模拟）','',n===1)).join('');}
else if(type==='subtitles'){title='字幕';content=option('简体中文','close-sheet','外部字幕',true)+option('English','close-sheet')+option('关闭字幕','close-sheet');}
else if(type==='tracks'){title='音轨';content=option('普通话','close-sheet','AAC · 立体声',true)+option('原声','close-sheet','AAC · 立体声');}
else if(type==='volume'){title='音量';content='<input class="seek" type="range" value="75" aria-label="音量">';}
else if(type==='library-more'){title='媒体库操作';content=option('编辑媒体库','go:library-edit')+option('访问权限','go:permissions')+option('扫描与刮削','go:tasks');}
else if(type==='account'){title='账号与连接';content='<dl class="specs"><dt>当前账号</dt><dd>Hector</dd><dt>角色</dt><dd>管理员</dd><dt>服务</dt><dd>本机 · 已连接</dd></dl>'+option('切换账号','toast:账号切换仅为示例');}
else if(type==='plugin-config'){title='TMDB 影视资料';content='<label class="field">API Key<input type="password" placeholder="填写 API Key" autocomplete="off"></label><p class="muted tiny">原型不会存储或发送你填写的内容。</p>'+option('测试连接','toast:原型不连接外部服务');}
else if(type==='density'){title='信息密度';content=option('紧凑','close-sheet','手机三列',true)+option('舒适','close-sheet','手机两列');}
else if(type==='seasons'){title='选择季';content=option('第 1 季','close-sheet','6 集',true)+option('第 2 季','close-sheet','6 集');}
else if(type==='queue-options'){title='队列操作';content=option('清空待播内容','clear-queue','保留当前曲目');}
else if(type==='track-more'){title='当前内容';content=option('下一首播放','enqueue')+option('加入播放队列','enqueue')+option('查看专辑','go:album');}
else{title='播放选项';content=option('睡眠定时','sheet:timer',state.timer?state.timer+' 分钟后暂停':'未设置')+option('音量','sheet:volume')+option('播放版本','sheet:versions')+option('结束播放','stop');}
return `<div class="overlay" data-dismiss="sheet"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><header class="sheet-head"><h2 id="sheet-title" tabindex="-1">${title}</h2>${ib('close','close-sheet','关闭弹窗')}</header><div class="sheet-body">${content}</div></section></div>`;}
function render(){const scroll=app.querySelector('.main')?.scrollTop||0;let p=byId[state.page];document.querySelector('#review-title').textContent=p[2];document.querySelector('#review-note').textContent=p[4];document.querySelector('#route-note').textContent='页面地址示例：#'+p[3]+' · 返回来源保存在 history.state';document.querySelectorAll('#page-list a').forEach(a=>a.classList.toggle('current',a.dataset.go===state.page));app.dataset.theme=state.theme;app.innerHTML=topbar()+`<main class="main ${['video-player','episode-player'].includes(state.page)?'video-main':''}">${body()}</main>`+(state.mini&&!['music-player','lyrics','audio-player','video-player','episode-player','queue','chapters'].includes(state.page)?mini():'')+popover()+sheet();app.querySelector('.main').scrollTop=scroll;app.querySelectorAll('[data-action^="popover:"]').forEach(b=>{b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded',String(state.pop===b.dataset.action.slice(8)));});app.querySelectorAll('.popover button,.popover a').forEach(b=>b.setAttribute('role','menuitem'));if(state.pop==='resource'){const anchor=app.querySelector('[data-action="popover:resource"]')?.getBoundingClientRect(),box=app.getBoundingClientRect(),menu=app.querySelector('.popover');if(anchor&&menu)menu.style.top=Math.max(56,Math.min(anchor.bottom-box.top,box.height-menu.offsetHeight-12))+'px';}if(state.sheet)app.querySelector('#sheet-title')?.focus({preventScroll:true});if(state.pop)app.querySelector('.popover [data-action],.popover a')?.focus({preventScroll:true});}
function channelFor(id){return byId[id]?.[3].match(/^\/media\/(video|music|audiobook)(?:\/|\?|$)/)?.[1]||state.channel;}
function go(id,replace=false){if(!byId[id])return;state.page=id;state.channel=channelFor(id);state.pop=null;state.sheet=null;let hash='#'+byId[id][3];if(location.hash!==hash)history[replace?'replaceState':'pushState']({prototypePage:id,from:location.hash},'',hash);render();app.querySelector('.main')?.scrollTo(0,0);}
function back(){let previous=history.state?.from;if(previous){history.back();return;}let id=state.page;go(['lyrics','queue'].includes(id)?'music-player':id==='chapters'?'book':id==='episode-player'?'show':id==='video-player'?'movie':id==='music-player'?'album':id==='audio-player'?'book':byId[id][1]==='设置与管理'&&id!=='settings'?'settings':state.channel==='music'?'music':state.channel==='audiobook'?'audiobooks':'video',true);}
function toast(message){app.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.role='status';d.textContent=message;app.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2600);}
function closeSheet(){state.sheet=null;render();if(trigger){let candidate=app.querySelector(`[data-action="${trigger}"]`);candidate?.focus({preventScroll:true});}}
function act(action){const [type,...rest]=action.split(':'),value=rest.join(':');switch(type){case'go':go(value);break;case'back':back();break;case'popover':state.pop=state.pop===value?null:value;render();break;case'sheet':state.pop=null;state.sheet=value;render();break;case'close-sheet':closeSheet();break;case'reading':state.pop=null;render();toast('阅读沿用现有界面，本原型不重画阅读页面');break;case'start':state.playing=true;state.mini=!['video','episode'].includes(value);go(value==='episode'?'episode-player':value==='video'?'video-player':value==='book'?'audio-player':'music-player');break;case'toggle':state.playing=!state.playing;render();break;case'stop':state.playing=false;state.mini=false;state.sheet=null;if(['music-player','audio-player','video-player','lyrics','queue'].includes(state.page))go(state.channel==='video'?'movie':state.channel==='music'?'album':'book');else render();break;case'track':state.current=Number(value);state.playing=true;state.mini=true;go('music-player');break;case'chapter':state.playing=true;state.mini=true;go('audio-player');break;case'previous':state.current=Math.max(0,state.current-1);render();break;case'next':state.current=(state.current+1)%state.queue.length;render();break;case'skip':toast(value==='30'?'已快进 30 秒（模拟）':'已快退 15 秒（模拟）');break;case'lyric':state.lyric=Number(value);render();break;case'timer':state.timer=Number(value);closeSheet();break;case'favorite':state.favorite=!state.favorite;state.pop=null;render();toast(state.favorite?'已收藏（模拟）':'已取消收藏（模拟）');break;case'enqueue':state.queue.push('清晨的风');closeSheet();toast('已加入播放队列（模拟）');break;case'clear-queue':state.queue=[state.queue[state.current]];state.current=0;closeSheet();break;case'scope':state.scope=value;render();break;case'clear-search':state.query='';render();app.querySelector('[name=q]')?.focus();break;case'theme':state.theme=value;document.querySelector('#review-theme').value=value;render();break;case'system-theme':state.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'forest';document.querySelector('#review-theme').value=state.theme;render();toast('已预览当前系统外观（模拟）');break;case'member':state.member=!state.member;render();break;case'candidate':state.selection=Number(value);render();break;case'fullscreen':if(document.fullscreenElement)document.exitFullscreen();else frame.requestFullscreen?.().catch(()=>toast('当前浏览器不支持全屏'));break;case'toast':closeSheet();toast(value);break;}}
app.addEventListener('click',e=>{let control=e.target.closest('[data-action],[data-go]');if(state.pop&&!e.target.closest('.popover')&&!control?.dataset.action?.startsWith('popover:')){state.pop=null;if(!control){render();return;}}if(control){if(control.dataset.go){e.preventDefault();go(control.dataset.go);}else {if(control.dataset.action.startsWith('popover:')||control.dataset.action.startsWith('sheet:')&&!state.sheet&&!state.pop)trigger=control.dataset.action;act(control.dataset.action);}}else if(e.target.matches('[data-dismiss=sheet]'))closeSheet();});
document.addEventListener('click',e=>{if(state.pop&&!e.composedPath().includes(app)){state.pop=null;render();}});
app.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.sheet){e.stopPropagation();closeSheet();}else if(state.pop){state.pop=null;render();}}if(e.key==='Tab'&&state.sheet){let nodes=[...app.querySelectorAll('.sheet button,.sheet input,.sheet select,.sheet summary,.sheet a')].filter(x=>!x.disabled),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='search-form'){state.query=new FormData(e.target).get('q')||'';render();}else toast(e.target.dataset.form||'已保存（模拟）');});
let group='';document.querySelector('#page-list').innerHTML=pages.map(p=>{let head=p[1]!==group?`<h2>${group=p[1]}</h2>`:'';return head+link(p[0],'<span class="dot"></span>'+p[2]);}).join('');document.querySelector('#page-list').addEventListener('click',e=>{let a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go);}});
document.querySelector('#device').addEventListener('change',e=>{frame.style.width=e.target.value+'px';frame.style.height=e.target.value==='1120'?'820px':'844px';});document.querySelector('#review-theme').addEventListener('change',e=>{state.theme=e.target.value;render();});document.querySelector('#directory-toggle').addEventListener('click',()=>document.querySelector('#directory').classList.toggle('open'));
function fromHash(){let p=pages.find(p=>'#'+p[3]===location.hash);if(p){state.page=p[0];state.channel=channelFor(p[0]);}state.pop=null;state.sheet=null;render();}window.addEventListener('popstate',fromHash);window.addEventListener('hashchange',fromHash);fromHash();
window.prototypeReview={pages:pages.map(p=>p[0]),go,setTheme(theme){state.theme=theme;render();},setWidth(width){frame.style.width=width+'px';frame.style.height=width>=700?'820px':'844px';},openSheet(name){state.sheet=name;render();}};
})();
</script></body></html>
