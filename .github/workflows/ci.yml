# Build and test: server (Node/TypeScript), web client, UI review, Android shell.
#
# Runs on pull requests and on pushes to every branch, main included (main is the
# long-lived development branch). Release tags and manual releases run it through
# release.yml (workflow_call) before any image is published.
name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      release-tag:
        description: The v* tag being released; versions the Android APK.
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A workflow_call run shares the caller's ref; keep it apart from a direct run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  format:
    name: Format · Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # HUSKY=0: CI needs Prettier only, not the git hooks.
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run format:check

  server:
    name: Server · typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      # The web suite imports server code (search parity), so both are installed.
      - run: npm ci --prefix server
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  ui-review:
    # The production bundle rendered in a real Chromium and measured; see docs/ui.md §7.
    name: Web · UI review
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      # The review starts its media fixture through the server's tsx.
      - run: npm ci --prefix server
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: npm run ui:review:only --prefix web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: artifacts/ui-review/react-app
          retention-days: 14

  android:
    name: Android · shell contract, debug + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags and history for `git describe`, which versions a non-release build.
          fetch-depth: 0
      - run: sh android/scripts/check-shell.sh
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The APK carries the current web build; verify-web-assets checks it is packed.
      - run: sh android/scripts/build-web-assets.sh
      - run: sh android/scripts/verify-web-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The hosted runner ships the Android SDK; this accepts the licences and adds
      # exactly what the build asks for. The action's default package list includes
      # `tools`, which current command-line tools no longer carry (sdkmanager fails).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.1
      # versionName: the release tag (v1.2.3 -> 1.2.3), otherwise `git describe`
      # (1.2.3-4-gabcdef0). versionCode: major*1000000 + minor*1000 + patch of that
      # version, so each release upgrades over the previous one.
      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag="${RELEASE_TAG:-$(git describe --tags --match 'v*' 2>/dev/null || echo v0.0.0-$(git rev-parse --short HEAD))}"
          name="${tag#v}"
          IFS=. read -r major minor patch <<< "${name%%[-+]*}"
          code=$(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
          [ "$code" -gt 0 ] || code=1
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Android versionName $name, versionCode $code"
      # Release signing: repository secrets ANDROID_KEYSTORE_BASE64 (base64 of the
      # .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and optionally
      # ANDROID_KEY_PASSWORD. Without them (forks, PRs from forks) the release APK is
      # signed with the runner's throwaway debug key, which cannot upgrade over a
      # build signed by another runner.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "READER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release APK is signed with the repository keystore."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release APK is signed with a debug key."
          fi
      - run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          "-PreaderVersionName=$VERSION_NAME" "-PreaderVersionCode=$VERSION_CODE"
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          READER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          READER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          READER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APKs
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android/reader-pro-$VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/reader-pro-$VERSION-debug.apk"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: reader-android-apk
          path: dist/android/reader-pro-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: reader-debug-apk
          path: dist/android/reader-pro-${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
          retention-days: 14
