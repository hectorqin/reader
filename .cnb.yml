# CI：服务端（Node/TypeScript）、客户端（Web/TypeScript）、Android 壳（Kotlin）。
#
# 每个任务都用 ifModify 限定到自己那部分，避免改一行 README 就把三条流水线
# 全跑一遍。

# 服务端与客户端都是 Node 生态，共用同一个镜像锚点。
.node-env: &node-env
  docker:
    image: node:24

.server-check: &server-check
  - name: install
    script: cd server && npm ci
  - name: typecheck
    script: cd server && npm run typecheck
  - name: test
    script: cd server && npm test
  - name: build
    script: cd server && npm run build

.client-check: &client-check
  - name: install
    script: cd web && npm ci
  - name: typecheck
    script: cd web && npm run typecheck
  - name: test
    script: cd web && npm test
  - name: build
    script: cd web && npm run build

main:
  push:
    - name: server-ci
      <<: *node-env
      ifModify:
        - server/**
      stages:
        - *server-check
      failStages:
        - name: report-failure
          script: echo "服务端 CI 失败：$CNB_BUILD_FAILED_MSG"

    - name: client-ci
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - *client-check
      failStages:
        - name: report-failure
          script: echo "客户端 CI 失败：$CNB_BUILD_FAILED_MSG"

    # Android 壳。
    #
    # 先跑一个不依赖 JDK 的静态检查（秒级），再编译。原因是桥接契约的两半分别
    # 用 Kotlin 和 TypeScript 写，互相没法类型检查：客户端调用一个壳里没有的
    # 方法是最容易出、也最难在本地发现的错误。静态检查把它提前到这里。
    #
    # 触发条件包含 `web/src/formats/types.ts`：壳里分支的渲染模式词表来自它，
    # 改一个词就会让整条原生渲染通道静默失效，而 Kotlin 编译器不会知道。
    # 镜像走 Docker Hub 命名空间，CNB 会自动经 Docker Hub 代理注入只读令牌。
    #
    # 这里曾写 `androidsdk/android-35:latest`，而 Docker Hub 的 `androidsdk`
    # 命名空间**没有**这个仓库 —— 它只发布到 `android-31`（`android-33` 及以上
    # 都是 404）。仓库不存在时 Docker Hub 返回 `pull access denied / repository
    # does not exist or may require 'docker login'`，daemon 会重试一次，然后
    # prepare 阶段直接失败：`docker pull failed: 任务执行失败，返回码：1`。整条
    # 流水线还没进入任何 stage 就红了，所以 `shell-contract`/`assemble` 全是
    # skipped —— 失败信息指向 `docker pull`，但真正的问题是镜像名指向了一个
    # 不存在的仓库，与令牌、网络、代理都无关。
    #
    # 改用 `mobiledevops/android-sdk-image`：Docker Hub 上真实存在且在维护的
    # 社区镜像（2026-07 仍有更新，多架构 amd64/arm64）。它的 `packages.txt` 含
    # `platforms;android-35` 与 `build-tools;35.0.1`，正好匹配本项目的
    # compileSdk/targetSdk=35；基础镜像是 ubuntu:24.04 + openjdk-21（满足
    # Gradle 8.11 与 AGP 8.7 对 JDK 17+ 的要求），并已预接受 SDK 许可，
    # assemble 不需要再联网下载平台组件。
    #
    # 用 `latest` 而不是 `36.1.0` 之类的构建工具版本号：这个仓库的 tag 是按
    # build-tools 版本命名的，`latest` 始终指向包含 android-35 的最新一份，
    # 写死版本反而会在下一次平台升级后被遗漏。若要完全可复现可改钉具体 tag。
    - name: android-ci
      docker:
        image: mobiledevops/android-sdk-image:latest
      ifModify:
        - android/**
        - web/src/android-bridge.d.ts
        - web/src/formats/types.ts
        - web/src/ui/native-page.ts
      stages:
        - name: shell-contract
          script: sh android/scripts/check-shell.sh
        - name: assemble
          script: cd android && ./gradlew --no-daemon :app:assembleDebug
      failStages:
        - name: report-failure
          script: echo "Android 构建失败：$CNB_BUILD_FAILED_MSG"

    # 客户端产物必须能被壳打包。这条单独跑，因为 `client-ci` 只证明 H5 能构建，
    # 不证明 assets 里有东西——而一个空的 assets 目录会产出一个启动即白屏的 APK。
    - name: web-assets-ci
      <<: *node-env
      ifModify:
        - web/**
        # 触发条件包含脚本自身与 assets 目录布局：改这段逻辑、或改 Gradle 里
        # `assets.srcDirs` 指到哪，本来不会跑任何验证，而它坏掉的形态是 APK 里
        # 没有客户端、启动即白屏 —— 只有跑一遍才知道。
        - android/scripts/build-web-assets.sh
        - android/scripts/verify-web-assets.sh
        - android/app/build.gradle.kts
        - android/app/src/main/assets/**
      stages:
        - name: stage-for-shell
          script: sh android/scripts/build-web-assets.sh
        # 只证明脚本写出了 assets 还不够，还要证明「写出来的东西真的会被打进 APK」。
        # 脚本只知道它写到哪，Gradle 只知道哪些目录算 assets，两者之间没有任何
        # 东西把它们连起来 —— 这两条路径此前就漂移过。
        - name: verify-assets-are-packaged
          script: sh android/scripts/verify-web-assets.sh

    # 发布镜像到制品库 `docker.cnb.cool/hectorqin/reader`。
    #
    # 只在 `server/`、`web/` 或构建文件变更时跑：镜像里只有这两部分。文档改一行
    # 也重新发布一个镜像，会让制品库里堆满内容完全相同的标签。
    #
    # 为什么用 CNB 官方的 `services: docker`，而不是 `docker.build` + kaniko
    # 插件任务：`docker.build` 的产物只活在 runner 的本地 dockerd 里，而平台
    # 起插件任务容器走的是 `docker pull <image>`，不查本地镜像列表——
    # `docker.build` 那条路要求 `image:` 写成与 `dockerfile` 同名的裸名字或
    # 缓存仓库地址，靠平台去跟已构建的镜像做匹配。这条流水线因此在 `main` 上
    # 连错八次，报错覆盖了 `pull access denied`（被当成 Docker Hub 官方镜像）
    # 与 `invalid reference format`（名字里有大写或非法字符）两类；最后是靠把
    # `image:` 指向 `dockerfile-caches` 的完整仓库地址跑通的，代价是那次匹配
    # 依赖把一个**缓存 digest** 写死进流水线。
    #
    # 换成 dind 之后整条链路上只剩标准 Docker：
    #   - 不再依赖平台对 `image:` 的匹配约定，也就不需要把缓存 digest 当镜像名；
    #   - 没有 kaniko，就不必为了 `COPY server/...` 保住大小写而绕开工作区，
    #     `GIT_CLONE_PATH` 那个补丁连同它带来的 `--context-sub-path` 需求一起没了；
    #   - 也不需要单独 `docker login`，CNB 起 dind 服务时会自动登录制品库，
    #     用的是同一次构建的临时令牌，权限天然对齐。
    # 之前维护的根目录 `Dockerfile` / `kaniko-plugin.sh` 随之删除。
    - name: docker-image
      services:
        - docker
      ifModify:
        - server/**
        - web/**
        - server/Dockerfile
        - .dockerignore
        # 触发条件包含自身，否则改完构建逻辑没法验证。
        - .cnb.yml
      stages:
        - name: docker build and push
          # 镜像路径按「同名制品」规则走，即 `docker.cnb.cool/hectorqin/reader`，
          # 与 README、docker-compose.yml 里引用的地址一致。用
          # `CNB_REPO_SLUG_LOWERCASE` 而不是写死 `hectorqin/reader`：Docker 要求
          # 仓库名全小写，而 CNB 的仓库路径本身可能带大写。
          #
          # 构建上下文是仓库根，`server/Dockerfile` 里那句 `COPY web/...` 依赖
          # 这一点（客户端产物要打进服务端镜像）。`services: docker` 下的任务
          # 工作目录就是仓库根，不需要额外指定 `-f`/`--context`。
          #
          # 两个标签：分支名给「跟 main 走」的部署用，短 commit 给需要回滚到
          # 某个确切版本的情况用。`main` 分支上两者分别是 `main` 和当次提交。
          # 逐个 `docker push` 而不是 `--all-tags`：文档里的写法就是显式推标签，
          # 不想把这条流水线绑在一个没被文档覆盖的 flag 上。
          script: |
            set -eu
            image="$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE"
            docker build -t "$image:$CNB_BRANCH" -t "$image:$CNB_COMMIT_SHORT" \
              -f server/Dockerfile .
            docker push "$image:$CNB_BRANCH"
            docker push "$image:$CNB_COMMIT_SHORT"
      failStages:
        - name: report-failure
          script: echo "镜像发布失败：$CNB_BUILD_FAILED_MSG"

"**":
  pull_request:
    - name: server-checks
      <<: *node-env
      ifModify:
        - server/**
      stages:
        - *server-check

    - name: client-checks
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - *client-check

    # PR 阶段只跑不依赖 JDK/SDK 的那半（秒级）。桥接契约断裂与渲染模式词表漂移
    # 是最容易出、最难在本地发现的错误 —— 两半分别用 Kotlin 和 TypeScript 写，
    # 互相没法类型检查 —— 而它们恰好都不需要编译就能查出来。完整 assembleDebug
    # 仍只在 main 的 push 上跑，PR 不该为一个 SDK 镜像等几分钟。
    - name: android-contract-checks
      <<: *node-env
      ifModify:
        - android/**
        - web/src/android-bridge.d.ts
        - web/src/formats/types.ts
        - web/src/ui/native-page.ts
      stages:
        - name: shell-contract
          script: sh android/scripts/check-shell.sh
