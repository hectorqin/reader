# CI：服务端（Node/TypeScript）、客户端（Web/TypeScript）、Android 壳（Kotlin）。
#
# 每个任务都用 ifModify 限定到自己那部分，避免改一行 README 就把三条流水线
# 全跑一遍。

# 服务端与客户端都是 Node 生态，共用同一个镜像锚点。
.node-env: &node-env
  docker:
    image: node:24

.server-check: &server-check
  - name: install
    script: cd server && npm ci
  - name: typecheck
    script: cd server && npm run typecheck
  - name: test
    script: cd server && npm test
  - name: build
    script: cd server && npm run build

.client-check: &client-check
  - name: install
    script: cd web && npm ci
  - name: typecheck
    script: cd web && npm run typecheck
  - name: test
    script: cd web && npm test
  - name: build
    script: cd web && npm run build

main:
  push:
    - name: server-ci
      <<: *node-env
      ifModify:
        - server/**
      stages:
        - *server-check
      failStages:
        - name: report-failure
          script: echo "服务端 CI 失败：$CNB_BUILD_FAILED_MSG"

    - name: client-ci
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - *client-check
      failStages:
        - name: report-failure
          script: echo "客户端 CI 失败：$CNB_BUILD_FAILED_MSG"

    # Android 壳。
    #
    # 先跑一个不依赖 JDK 的静态检查（秒级），再编译。原因是桥接契约的两半分别
    # 用 Kotlin 和 TypeScript 写，互相没法类型检查：客户端调用一个壳里没有的
    # 方法是最容易出、也最难在本地发现的错误。静态检查把它提前到这里。
    #
    # 触发条件包含 `web/src/formats/types.ts`：壳里分支的渲染模式词表来自它，
    # 改一个词就会让整条原生渲染通道静默失效，而 Kotlin 编译器不会知道。
    # 镜像走 Docker Hub 官方命名空间，CNB 会自动经 Docker Hub 代理注入只读令牌。
    # 不要写 `docker.cnb.cool/dockerhub/androidsdk/android-35`：`dockerhub/` 是
    # 代理命名空间，只有 Docker Hub 上真实存在的镜像才解析得到，而
    # `androidsdk/android-35` 并不是 —— 令牌颁发阶段就被拒（unauthorized），
    # 表现为 prepare 阶段 docker pull 失败、整条流水线还没开始就跑不起来。
    #
    # 之所以选 `androidsdk/android-35` 而不是官方 `androidsdk/android-sdk`：这条
    # CI 的 targetsdk 是 35，镜像里必须带 android-35 平台，否则 assemble 会去
    # 下载 SDK 组件。`android-35` 这个社区镜像正好只装它。
    - name: android-ci
      docker:
        image: androidsdk/android-35:latest
      ifModify:
        - android/**
        - web/src/android-bridge.d.ts
        - web/src/formats/types.ts
        - web/src/ui/native-page.ts
      stages:
        - name: shell-contract
          script: sh android/scripts/check-shell.sh
        - name: assemble
          script: cd android && ./gradlew --no-daemon :app:assembleDebug
      failStages:
        - name: report-failure
          script: echo "Android 构建失败：$CNB_BUILD_FAILED_MSG"

    # 客户端产物必须能被壳打包。这条单独跑，因为 `client-ci` 只证明 H5 能构建，
    # 不证明 assets 里有东西——而一个空的 assets 目录会产出一个启动即白屏的 APK。
    - name: web-assets-ci
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - name: stage-for-shell
          script: sh android/scripts/build-web-assets.sh

    # 发布镜像到制品库 `docker.cnb.cool/hectorqin/reader`。
    #
    # 只在 `server/`、`web/` 或构建文件变更时跑：镜像里只有这两部分。文档改一行
    # 也重新发布一个镜像，会让制品库里堆满内容完全相同的标签。
    #
    # 为什么不用插件市场的 kaniko 插件：本仓库以 Windows / macOS 客户端为主，
    # Windows 上 git 会把工作区 checkout 成全小写，而 Kaniko 默认 snapshotter
    # 只保留全大写路径，`COPY server/...` 会直接失败；且上游插件没有透出
    # `--context-sub-path`。`kaniko.Dockerfile` + `kaniko/` 就是上游插件加三处
    # 修正，细节写在那个 Dockerfile 的注释里。
    -
      name: docker-image
      ifModify:
        - server/**
        - web/**
        - server/Dockerfile
        - .dockerignore
        - kaniko.Dockerfile
        - kaniko/**
        # 触发条件包含自身，否则改完构建逻辑没法验证。
        - .cnb.yml
      # GIT_CLONE_PATH 必须在这里就声明：流水线启动时 CNB 用它决定从哪个
      # 目录加载仓库，放到 stages.env 里就晚了。
      env:
        GIT_CLONE_PATH: /tmp/cnb-workspace
      docker:
        build:
          # dockerfile 必须在仓库根下：CNB 把构建上下文限制在仓库根目录内，
          # 而 Git 的仓库根就是 cwd，工作区比它高一层。
          dockerfile: kaniko.Dockerfile
          # CNB 只把 `by` 里列出的文件放进构建上下文，`plugin.sh` 不在列的话
          # 并不会报错，只是 Dockerfile 里那句 COPY 找不到文件。
          by:
            - kaniko/plugin.sh
      stages:
        - name: build & push
          # 名字必须全小写：CNB 拿这个字符串当镜像名去 `docker pull`，
          # Docker 不接受仓库名里出现大写字符。
          image: kaniko
          settings:
            # 凭证走插件参数，别再单独跑 `docker login`：这个镜像是 kaniko 的
            # debug 版，里面没有任何 docker CLI，写了也是 `docker: not found`。
            username: $CNB_TOKEN_USER_NAME
            password: $CNB_TOKEN
            registry: $CNB_DOCKER_REGISTRY
            repo: $CNB_REPO_SLUG
            tags: $CNB_BRANCH,$CNB_COMMIT_SHORT
            dockerfile: server/Dockerfile
            # Kaniko 的构建上下文必须限制在 git 仓库根目录内，而 CNB 工作区
            # 比仓库根高一层（GIT_CLONE_PATH 是它的子目录），所以用 binary
            # 参数把它指到克隆出来的仓库根。
            binary: $GIT_CLONE_PATH
            # snapshotter 压平上层文件容易丢大小写（见文件头注释），构建时也
            # 显式指定一次，避免依赖镜像内的默认值。
            snapshot_mode: redo
            cache: true
            log: debug
      failStages:
        - name: report-failure
          script: echo "镜像发布失败：$CNB_BUILD_FAILED_MSG"

"**":
  pull_request:
    - name: server-checks
      <<: *node-env
      ifModify:
        - server/**
      stages:
        - *server-check

    - name: client-checks
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - *client-check
