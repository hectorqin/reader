# CI：服务端（Node/TypeScript）、客户端（Web/TypeScript）、Android 壳（Kotlin）。
#
# 每个任务都用 ifModify 限定到自己那部分，避免改一行 README 就把三条流水线
# 全跑一遍。

# 服务端与客户端都是 Node 生态，共用同一个镜像锚点。
.node-env: &node-env
  docker:
    image: node:24

.server-check: &server-check
  - name: install
    script: cd server && npm ci
  - name: typecheck
    script: cd server && npm run typecheck
  - name: test
    script: cd server && npm test
  - name: build
    script: cd server && npm run build

.client-check: &client-check
  - name: install
    script: cd web && npm ci
  - name: typecheck
    script: cd web && npm run typecheck
  - name: test
    script: cd web && npm test
  - name: build
    script: cd web && npm run build

main:
  push:
    - name: server-ci
      <<: *node-env
      ifModify:
        - server/**
      stages:
        - *server-check
      failStages:
        - name: report-failure
          script: echo "服务端 CI 失败：$CNB_BUILD_FAILED_MSG"

    - name: client-ci
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - *client-check
      failStages:
        - name: report-failure
          script: echo "客户端 CI 失败：$CNB_BUILD_FAILED_MSG"

    # Android 壳。
    #
    # 先跑一个不依赖 JDK 的静态检查（秒级），再编译。原因是桥接契约的两半分别
    # 用 Kotlin 和 TypeScript 写，互相没法类型检查：客户端调用一个壳里没有的
    # 方法是最容易出、也最难在本地发现的错误。静态检查把它提前到这里。
    #
    # 触发条件包含 `web/src/formats/types.ts`：壳里分支的渲染模式词表来自它，
    # 改一个词就会让整条原生渲染通道静默失效，而 Kotlin 编译器不会知道。
    # 镜像走 Docker Hub 官方命名空间，CNB 会自动经 Docker Hub 代理注入只读令牌。
    # 不要写 `docker.cnb.cool/dockerhub/androidsdk/android-35`：`dockerhub/` 是
    # 代理命名空间，只有 Docker Hub 上真实存在的镜像才解析得到，而
    # `androidsdk/android-35` 并不是 —— 令牌颁发阶段就被拒（unauthorized），
    # 表现为 prepare 阶段 docker pull 失败、整条流水线还没开始就跑不起来。
    #
    # 之所以选 `androidsdk/android-35` 而不是官方 `androidsdk/android-sdk`：这条
    # CI 的 targetsdk 是 35，镜像里必须带 android-35 平台，否则 assemble 会去
    # 下载 SDK 组件。`android-35` 这个社区镜像正好只装它。
    - name: android-ci
      docker:
        image: androidsdk/android-35:latest
      ifModify:
        - android/**
        - web/src/android-bridge.d.ts
        - web/src/formats/types.ts
        - web/src/ui/native-page.ts
      stages:
        - name: shell-contract
          script: sh android/scripts/check-shell.sh
        - name: assemble
          script: cd android && ./gradlew --no-daemon :app:assembleDebug
      failStages:
        - name: report-failure
          script: echo "Android 构建失败：$CNB_BUILD_FAILED_MSG"

    # 客户端产物必须能被壳打包。这条单独跑，因为 `client-ci` 只证明 H5 能构建，
    # 不证明 assets 里有东西——而一个空的 assets 目录会产出一个启动即白屏的 APK。
    - name: web-assets-ci
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - name: stage-for-shell
          script: sh android/scripts/build-web-assets.sh

    # 发布镜像到制品库 `docker.cnb.cool/hectorqin/reader`。
    #
    # 只在 `server/`、`web/` 或构建文件变更时跑：镜像里只有这两部分。文档改一行
    # 也重新发布一个镜像，会让制品库里堆满内容完全相同的标签。
    #
    # 用 CNB 官方的 `services: docker` + `docker build` / `docker push`，
    # 而不是插件市场的 kaniko。原因是插件任务（`image:`）的镜像名必须是一个
    # 真实的镜像引用：CNB 先 `docker pull` 它，拉不到就直接判失败，连容器的
    # entrypoint 都不会执行。所以「先用 docker.build 构建一个镜像，再让插件任务
    # 去用」这条路走不通——哪怕 `docker.build` 已经成功构建并处理好了本地缓存，
    # 到了插件任务那一步仍然是 `docker pull <那个名字>`，而它在任何 registry 上
    # 都不存在（失败日志就是这个形状：`docker pull Dockerfile` → 404）。
    # `docker.build` 的产物只能给流水线级的 `docker.image` 用，即所有任务都在
    # 那个镜像里跑，与本任务「在普通环境里构建并推送 reader 镜像」的意图不符。
    #
    # 换成 dind 之后整条链路上只剩标准 Docker：
    #   - 没有 kaniko，就不需要为了 `COPY server/...` 保住大小写而绕开工作区，
    #     `GIT_CLONE_PATH` 那个补丁连同它带来的 `--context-sub-path` 需求一起没了；
    #   - 也不需要单独 `docker login`，CNB 起 dind 服务时会自动登录制品库，
    #     且登录用的是同一次构建的临时令牌，权限天然对齐。
    # 之前维护的根目录 `Dockerfile` / `kaniko-plugin.sh` 随之删除。
    - name: docker-image
      services:
        - docker
      ifModify:
        - server/**
        - web/**
        - server/Dockerfile
        - .dockerignore
        # 触发条件包含自身，否则改完构建逻辑没法验证。
        - .cnb.yml
      stages:
        - name: docker build and push
          # 镜像路径按「同名制品」规则走，即 `docker.cnb.cool/hectorqin/reader`，
          # 与 README、docker-compose.yml 里引用的地址一致。用
          # `CNB_REPO_SLUG_LOWERCASE` 而不是写死 `hectorqin/reader`：Docker 要求
          # 仓库名全小写，而 CNB 的仓库路径本身可能带大写。
          #
          # 构建上下文是仓库根，`server/Dockerfile` 里那句 `COPY web/...` 依赖
          # 这一点（客户端产物要打进服务端镜像）。`services: docker` 下的任务
          # 工作目录就是仓库根，不需要额外指定 `-f`/`--context`。
          #
          # 两个标签：分支名给「跟 main 走」的部署用，短 commit 给需要回滚到
          # 某个确切版本的情况用。`main` 分支上两者分别是 `main` 和当次提交。
          # 逐个 `docker push` 而不是 `--all-tags`：文档里的写法就是显式推标签，
          # 不想把这条流水线绑在一个没被文档覆盖的 flag 上。
          script: |
            set -eu
            image="$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE"
            docker build -t "$image:$CNB_BRANCH" -t "$image:$CNB_COMMIT_SHORT" \
              -f server/Dockerfile .
            docker push "$image:$CNB_BRANCH"
            docker push "$image:$CNB_COMMIT_SHORT"
      failStages:
        - name: report-failure
          script: echo "镜像发布失败：$CNB_BUILD_FAILED_MSG"

"**":
  pull_request:
    - name: server-checks
      <<: *node-env
      ifModify:
        - server/**
      stages:
        - *server-check

    - name: client-checks
      <<: *node-env
      ifModify:
        - web/**
      stages:
        - *client-check
